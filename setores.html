<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Índice dos 21 setores — Londres 1895</title><style>*{box-sizing:border-box}body{margin:0;background:#131817;color:#f1e4ca;font:14px system-ui}header{position:fixed;z-index:10;top:0;left:0;right:0;padding:10px 14px;background:#15211ff0;display:flex;align-items:center;justify-content:space-between;gap:10px}header b{font-size:15px}header small{display:block;color:#c6b99d}button{cursor:pointer}#map{position:fixed;inset:64px 0 64px;overflow:hidden;touch-action:none}#scene{position:absolute;width:1672px;height:941px;transform-origin:0 0}#scene img{display:block;width:1672px;height:941px} .pin{position:absolute;border-radius:18px;border:2px solid #fff0b9;background:#173c3be9;color:#fff3d7;padding:5px 8px;font:bold 16px system-ui;transform:translate(-50%,-50%);box-shadow:0 2px 7px #000a;touch-action:none}.pin.selected{background:#ffe8a6;color:#182522;border-color:#124c51}.pin.approved{border-color:#00e8e8}#s1{position:absolute;left:317px;top:269px;width:362px;height:178px;border:3px dashed #00e8e8;background:#00ffff0d;pointer-events:none}footer{position:fixed;bottom:0;left:0;right:0;min-height:64px;background:#15211ff2;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px}#detail{font-size:12px;line-height:1.35;max-width:72%}#detail b{font-size:15px}footer button,header button{border:1px solid #baa57c;border-radius:8px;background:#ead7ae;color:#202b29;font-weight:bold;padding:9px 12px}#controls{display:flex;gap:6px}#controls button{font-size:18px;padding:8px 12px}</style><header><div><b>Londres 1895 · Índice S1–S21</b><small>Marcadores provisórios sobre o mapa-mestre intacto</small></div><button id="reset">Ver tudo</button></header><div id="map"><div id="scene"><img src="mapa_mestre_original.png" alt="Mapa mestre original"><div id="s1"></div></div></div><footer><div id="detail"><b>Selecione um setor</b><div>As posições são referências, não recortes nem encaixes validados.</div></div><div id="controls"><button id="minus">−</button><button id="plus">+</button></div></footer><script>const places=[["S1","Baker Street / Marylebone",515,354],["S2","Regent’s Park",687,200],["S3","Camden",987,143],["S4","Paddington",239,366],["S5","Bloomsbury",979,330],["S6","Clerkenwell",1365,308],["S7","Westminster",653,732],["S8","Soho / Mayfair",733,437],["S9","Lambeth / Southwark",1103,746],["S10","Kensington",114,608],["S11","Hyde Park",332,502],["S12","Chelsea",215,780],["S13","Piccadilly",764,507],["S14","Whitehall",791,590],["S15","City de Londres",1486,388],["S16","Blackfriars",1406,644],["S17","Vauxhall",844,828],["S18","Islington",1218,184],["S19","St John’s Wood",382,215],["S20","Hampstead",522,72],["S21","Hackney",1528,197]];const v=document.querySelector('#map'),s=document.querySelector('#scene'),d=document.querySelector('#detail');let scale=1,fitScale=1,tx=0,ty=0,pts=new Map(),lastDist=0;function clamp(){let w=1672*scale,h=941*scale;tx=w<v.clientWidth?(v.clientWidth-w)/2:Math.min(0,Math.max(v.clientWidth-w,tx));ty=h<v.clientHeight?(v.clientHeight-h)/2:Math.min(0,Math.max(v.clientHeight-h,ty))}function render(){clamp();s.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')'}function fit(){fitScale=Math.min(v.clientWidth/1672,v.clientHeight/941);scale=fitScale;tx=(v.clientWidth-1672*scale)/2;ty=(v.clientHeight-941*scale)/2;render()}function zoom(f,x,y){let next=Math.min(fitScale*8,Math.max(fitScale,scale*f)),r=next/scale;tx=x-(x-tx)*r;ty=y-(y-ty)*r;scale=next;render()}for(const [id,name,x,y]of places){const b=document.createElement('button');b.className='pin'+(id==='S1'?' approved':'');b.textContent=id;b.style.left=x+'px';b.style.top=y+'px';b.addEventListener('click',()=>{document.querySelectorAll('.pin').forEach(e=>e.classList.remove('selected'));b.classList.add('selected');d.innerHTML='<b>'+id+' · '+name+'</b><div>'+(id==='S1'?'Limite anterior indicado em azul; arte ainda não validada.':'Ponto de referência provisório; limites ainda não definidos.')+'</div>';let target=Math.max(scale,fitScale*2.4);scale=target;tx=v.clientWidth/2-x*scale;ty=v.clientHeight/2-y*scale;render()});s.append(b)}v.addEventListener('pointerdown',e=>{if(e.target.closest('.pin'))return;v.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);lastDist=0});v.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const old=pts.get(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size===1){tx+=e.clientX-old[0];ty+=e.clientY-old[1];render()}else if(pts.size===2){const p=[...pts.values()],dist=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);if(lastDist)zoom(dist/lastDist,(p[0][0]+p[1][0])/2,(p[0][1]+p[1][1])/2);lastDist=dist}});for(const ev of ['pointerup','pointercancel'])v.addEventListener(ev,e=>{pts.delete(e.pointerId);lastDist=0});v.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(-e.deltaY*.002),e.clientX,e.clientY)},{passive:false});document.querySelector('#reset').onclick=fit;document.querySelector('#plus').onclick=()=>zoom(1.5,v.clientWidth/2,v.clientHeight/2);document.querySelector('#minus').onclick=()=>zoom(1/1.5,v.clientWidth/2,v.clientHeight/2);addEventListener('resize',fit);fit()</script></html>
