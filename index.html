<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>London 1895 — mapa navegável</title><style>*{box-sizing:border-box}body{margin:0;background:#1d1b16;color:#f5e6ca;font:15px system-ui}header{position:absolute;z-index:2;top:12px;left:12px;background:#26231cdd;border:1px solid #9d8059;border-radius:12px;padding:12px;max-width:340px}header strong{display:block}small{color:#d0bfa0}#viewport{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab}#map{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;user-select:none;pointer-events:none}#map img{width:100%;height:100%;display:block}nav{position:absolute;bottom:16px;right:16px;display:flex;gap:8px}button{background:#e8d3a8;border:1px solid #987b4c;border-radius:10px;padding:12px 16px;font-weight:bold;font-size:18px}#scale{position:absolute;bottom:18px;left:16px;background:#26231cdd;border-radius:8px;padding:8px}</style><div id="viewport"><div id="map"><img src="mapa_mestre_original.png" draggable="false" alt="Mapa mestre de Londres em 1895"></div></div><header><strong>🎩 Londres 1895 — navegação experimental</strong><small>Arraste para mover · use dois dedos ou a roda do mouse para zoom.</small></header><div id="scale">Zoom <span id="zoom">1.0×</span></div><nav><button id="minus">−</button><button id="reset">⌂</button><button id="plus">+</button></nav><script>const vp=document.querySelector('#viewport'),el=document.querySelector('#map'),label=document.querySelector('#zoom');const W=1672,H=941;let scale=1,base=1,x=0,y=0,points=new Map(),prevDist=0;function bounds(){let vw=vp.clientWidth,vh=vp.clientHeight,mw=W*scale,mh=H*scale;x=mw<=vw?(vw-mw)/2:Math.min(0,Math.max(vw-mw,x));y=mh<=vh?(vh-mh)/2:Math.min(0,Math.max(vh-mh,y));}function draw(){bounds();el.style.width=W+'px';el.style.height=H+'px';el.style.transform=`translate(${x}px,${y}px) scale(${scale})`;label.textContent=(scale/base).toFixed(2)+'×';}function fit(){base=Math.min(vp.clientWidth/W,vp.clientHeight/H);scale=base;x=(vp.clientWidth-W*scale)/2;y=(vp.clientHeight-H*scale)/2;draw()}function zoomAt(f,cx,cy){let next=Math.max(base,Math.min(base*5,scale*f)),ratio=next/scale;x=cx-(cx-x)*ratio;y=cy-(cy-y)*ratio;scale=next;draw()}vp.addEventListener('wheel',e=>{e.preventDefault();zoomAt(Math.exp(-e.deltaY*.001),e.clientX,e.clientY)},{passive:false});vp.addEventListener('pointerdown',e=>{vp.setPointerCapture(e.pointerId);points.set(e.pointerId,[e.clientX,e.clientY]);prevDist=0});vp.addEventListener('pointermove',e=>{if(!points.has(e.pointerId))return;let old=points.get(e.pointerId);points.set(e.pointerId,[e.clientX,e.clientY]);if(points.size===1){x+=e.clientX-old[0];y+=e.clientY-old[1];draw()}else if(points.size===2){let p=[...points.values()],dist=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);if(prevDist)zoomAt(dist/prevDist,(p[0][0]+p[1][0])/2,(p[0][1]+p[1][1])/2);prevDist=dist}});for(let ev of ['pointerup','pointercancel'])vp.addEventListener(ev,e=>{points.delete(e.pointerId);prevDist=0});document.querySelector('#plus').onclick=()=>zoomAt(1.5,vp.clientWidth/2,vp.clientHeight/2);document.querySelector('#minus').onclick=()=>zoomAt(1/1.5,vp.clientWidth/2,vp.clientHeight/2);document.querySelector('#reset').onclick=fit;addEventListener('resize',fit);fit();</script></html>
